<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel – SpickerSeite</title>
    <style>
        /* ── DESIGN (Admin-Style) ── */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1b4f72; /* Dunklerer Hintergrund für Admin */
            color: white;
            padding: 40px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 900px;
            margin: auto;
        }

        h2 { border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 10px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-action {
            padding: 5px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-approve { background: #2ecc71; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        .form-group { margin-top: 30px; }
        input { padding: 10px; border-radius: 5px; border: none; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>🛠 Admin Dashboard</h1>
        <a href="start.html" style="color: #5dade2; text-decoration: none;">← Zurück zur Startseite</a>

        <div class="section">
            <h2>Studenten freischalten</h2>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>E-Mail</th>
                        <th>Status</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="user-list-body">
                    <!-- Wartende User -->
                </tbody>
            </table>
        </div>

        <div class="section form-group">
            <h2>Neues Fach hinzufügen</h2>
            <input type="text" id="new-subject-name" placeholder="Fachname">
            <input type="text" id="new-subject-info" placeholder="Kurzinfo">
            <button class="btn-action btn-approve" onclick="addSubject()">Hinzufügen</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check: Nur Admins dürfen hier sein
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || !userDoc.data().isAdmin) {
                alert("Zugriff verweigert!");
                window.location.href = 'start.html';
            } else {
                loadPendingUsers();
            }
        });

        async function loadPendingUsers() {
            const q = query(collection(db, "users"), where("isApproved", "==", false));
            const querySnapshot = await getDocs(q);
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = "";
            querySnapshot.forEach((user) => {
                const data = user.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${data.name}</td>
                        <td>${data.email}</td>
                        <td>Wartend</td>
                        <td><button class="btn-action btn-approve" onclick="approveUser('${user.id}')">Zulassen</button></td>
                    </tr>
                `;
            });
        }

        window.approveUser = async (uid) => {
            await updateDoc(doc(db, "users", uid), { isApproved: true });
            alert("User freigeschaltet!");
            loadPendingUsers();
        };

        window.addSubject = async () => {
            const name = document.getElementById('new-subject-name').value;
            const info = document.getElementById('new-subject-info').value;
            if(!name) return;
            await setDoc(doc(collection(db, "subjects")), { name, info });
            alert("Fach hinzugefügt!");
            location.reload();
        };
    </script>
</body>
</html>
