<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel – SpickerSeite</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #1b4f72;
            color: white;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .admin-btn {
            color: #ffeb3b !important;
        }

        /* ── ADMIN CONTAINER ── */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        h2 {
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-top: 35px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── TABELLEN ── */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        th {
            background: rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }

        .pending-row {
            background: rgba(243, 156, 18, 0.18);
        }

        /* ── BADGES & BUTTONS ── */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-active {
            background: #2ecc71;
            color: white;
        }

        .badge-pending {
            background: #e67e22;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .badge-admin {
            background: #f1c40f;
            color: #1b4f72;
        }

        .badge-user {
            background: #7f8c8d;
            color: white;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 0.8; }
        }

        .btn-action {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 3px;
            transition: all 0.2s;
            display: inline-block;
            color: white;
        }

        .btn-approve {
            background: #2ecc71;
        }

        .btn-block {
            background: #e67e22;
        }

        .btn-make-admin {
            background: #f1c40f;
            color: #1b4f72 !important;
        }

        .btn-remove-admin {
            background: #95a5a6;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-action:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .loading-row {
            text-align: center;
            padding: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">Lade...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn">🛠 Admin</a>
            <a id="logout-btn" onclick="logout()" style="cursor: pointer;">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-card">
            <h1>🛠 Admin Dashboard</h1>
            
            <!-- SEKTION 1: PASSWORT RESET ANFRAGEN -->
            <div class="section">
                <h2>🔑 Offene Passwort-Reset Anfragen</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>E-Mail</th>
                                <th>Datum der Anfrage</th>
                                <th>Aktion</th>
                            </tr>
                        </thead>
                        <tbody id="reset-requests-body">
                            <tr><td colspan="3" class="loading-row">Lade Anfragen...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SEKTION 2: NUTZERVERWALTUNG -->
            <div class="section">
                <h2>👥 Nutzerverwaltung & Freischaltungen</h2>
                <div class="table-responsive">
                    <table id="user-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>E-Mail</th>
                                <th>Status</th>
                                <th>Rolle</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            <tr><td colspan="5" class="loading-row">Lade registrierte Nutzer...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            getDoc, 
            updateDoc, 
            deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const SUPERADMIN_EMAIL = 'julianknuhr92@gmail.com';

        // ── ABMELDEN FUNKTION ──
        window.logout = async () => {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (err) {
                console.error("Fehler beim Logout:", err);
                window.location.href = 'login.html';
            }
        };

        // ── AUTH CHECK ──
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const isSuperAdmin = (user.email && user.email.toLowerCase() === SUPERADMIN_EMAIL);
            
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (userDoc.exists()) {
                    const data = userDoc.data();
                    if (!data.isAdmin && !isSuperAdmin) {
                        alert("Zugriff verweigert: Du besitzt keine Administrator-Rechte.");
                        window.location.href = 'start.html';
                        return;
                    }
                    document.getElementById('user-name').textContent = (data.name || user.email) + " (Admin)";
                } else if (isSuperAdmin) {
                    document.getElementById('user-name').textContent = "Julian (Haupt-Admin)";
                } else {
                    window.location.href = 'login.html';
                    return;
                }

                // Listener starten
                startUserListener();
                startPasswordRequestsListener();

            } catch (err) {
                console.error("Auth-Check Fehler:", err);
                if (isSuperAdmin) {
                    document.getElementById('user-name').textContent = "Julian (Haupt-Admin)";
                    startUserListener();
                    startPasswordRequestsListener();
                }
            }
        });

        // ── 1. LIVE USER LISTE ──
        function startUserListener() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Keine Nutzer registriert.</td></tr>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    const uid = docSnap.id;
                    const isSuperadmin = (u.email && u.email.toLowerCase() === SUPERADMIN_EMAIL);

                    const tr = document.createElement('tr');
                    if (!u.isApproved && !isSuperadmin) {
                        tr.className = 'pending-row';
                    }

                    // Status Badge
                    const statusBadge = (u.isApproved || isSuperadmin)
                        ? '<span class="badge badge-active">✅ Freigeschaltet</span>' 
                        : '<span class="badge badge-pending">⏳ Wartet auf Freigabe</span>';

                    // Rollen Badge
                    const roleBadge = (u.isAdmin || isSuperadmin)
                        ? '<span class="badge badge-admin">👑 Admin</span>' 
                        : '<span class="badge badge-user">Student</span>';

                    // Freigabe-Button (Freischalten / Sperren)
                    let toggleApproveBtn = '';
                    if (!isSuperadmin) {
                        toggleApproveBtn = u.isApproved 
                            ? `<button class="btn-action btn-block" onclick="toggleApproval('${uid}', false)">Sperren</button>`
                            : `<button class="btn-action btn-approve" onclick="toggleApproval('${uid}', true)">✅ Freischalten</button>`;
                    }

                    // Admin-Rollen Button (Zum Admin machen / entziehen)
                    let toggleAdminBtn = '';
                    if (!isSuperadmin) {
                        toggleAdminBtn = u.isAdmin 
                            ? `<button class="btn-action btn-remove-admin" onclick="toggleAdminRole('${uid}', false)">Admin entziehen</button>`
                            : `<button class="btn-action btn-make-admin" onclick="toggleAdminRole('${uid}', true)">👑 Zum Admin machen</button>`;
                    } else {
                        toggleAdminBtn = `<span style="font-size:12px; opacity:0.6; margin-right:5px;">(Haupt-Admin)</span>`;
                    }

                    // Löschen-Button
                    const deleteBtn = !isSuperadmin 
                        ? `<button class="btn-action btn-delete" onclick="deleteUser('${uid}', '${u.name || u.email}')">Löschen</button>`
                        : '';

                    tr.innerHTML = `
                        <td><strong>${escapeHtml(u.name || '–')}</strong></td>
                        <td>${escapeHtml(u.email || '–')}</td>
                        <td>${statusBadge}</td>
                        <td>${roleBadge}</td>
                        <td>
                            ${toggleApproveBtn}
                            ${toggleAdminBtn}
                            ${deleteBtn}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }, (error) => {
                console.error("Fehler beim Laden der Nutzer:", error);
                document.getElementById('user-list-body').innerHTML = 
                    '<tr><td colspan="5" style="color:#ff6b6b; text-align:center;">Fehler beim Laden: ' + error.message + '</td></tr>';
            });
        }

        // ── 2. LIVE PASSWORT-ANFRAGEN ──
        function startPasswordRequestsListener() {
            onSnapshot(collection(db, "passwordRequests"), (snapshot) => {
                const tbody = document.getElementById('reset-requests-body');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; opacity:0.7;">Keine offenen Passwort-Anfragen vorhanden.</td></tr>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const req = docSnap.data();
                    const reqId = docSnap.id;
                    const dateStr = req.requestedAt ? new Date(req.requestedAt.toDate()).toLocaleString('de-DE') : '–';

                    const tr = document.createElement('tr');
                    tr.style.background = 'rgba(231, 76, 60, 0.15)';

                    tr.innerHTML = `
                        <td><strong>${escapeHtml(req.email)}</strong></td>
                        <td>${dateStr}</td>
                        <td>
                            <button class="btn-action btn-approve" onclick="resolvePasswordReset('${reqId}', '${req.email}')">
                                ✅ Erledigt / Löschen
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }, (error) => {
                console.error("Fehler bei Passwort-Anfragen:", error);
                document.getElementById('reset-requests-body').innerHTML = 
                    '<tr><td colspan="3" style="text-align:center; opacity:0.7;">Keine offenen Anfragen oder Regeln nicht gesetzt.</td></tr>';
            });
        }

        // ── AKTIONEN ──
        window.toggleApproval = async (uid, newStatus) => {
            try {
                await updateDoc(doc(db, "users", uid), { isApproved: newStatus });
            } catch (err) {
                alert("Fehler beim Ändern des Status: " + err.message);
            }
        };

        window.toggleAdminRole = async (uid, makeAdmin) => {
            const confirmMsg = makeAdmin 
                ? "Soll dieser Nutzer zum Administrator ernannt werden?"
                : "Sollen diesem Nutzer die Admin-Rechte entzogen werden?";

            if (!confirm(confirmMsg)) return;

            try {
                await updateDoc(doc(db, "users", uid), { isAdmin: makeAdmin });
            } catch (err) {
                alert("Fehler beim Ändern der Admin-Rechte: " + err.message);
            }
        };

        window.deleteUser = async (uid, userName) => {
            if (!confirm(`Nutzer "${userName}" wirklich aus Firestore löschen?`)) return;

            try {
                await deleteDoc(doc(db, "users", uid));
            } catch (err) {
                alert("Fehler beim Löschen: " + err.message);
            }
        };

        window.resolvePasswordReset = async (reqId, email) => {
            if (!confirm(`Anfrage für ${email} erledigt und aus der Liste entfernen?`)) return;
            try {
                await deleteDoc(doc(db, "passwordRequests", reqId));
            } catch (err) {
                alert("Fehler: " + err.message);
            }
        };

        function escapeHtml(text) {
            const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
