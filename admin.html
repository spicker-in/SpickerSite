<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel – SpickerSeite</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #1b4f72; color: white; min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; cursor: pointer; }
        .admin-btn { color: #ffeb3b !important; }

        /* ── ADMIN CONTENT ── */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .admin-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 35px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 { margin-top: 0; }
        h2 { border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 10px; margin-top: 30px; }

        /* ── TABELLE ── */
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%; border-collapse: collapse;
            background: rgba(0, 0, 0, 0.25); border-radius: 12px; overflow: hidden;
        }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; }
        th { background: rgba(255, 255, 255, 0.15); font-weight: 600; }

        /* ── BADGES & BUTTONS ── */
        .badge {
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block;
        }
        .badge-active { background: #2ecc71; color: white; }
        .badge-blocked { background: #e67e22; color: white; }
        .badge-admin { background: #f1c40f; color: #2c3e50; }
        .badge-user { background: #95a5a6; color: white; }

        .btn-action {
            padding: 7px 12px; border-radius: 6px; border: none; cursor: pointer;
            font-weight: bold; font-size: 12px; margin-right: 5px; margin-bottom: 3px;
            transition: all 0.2s; text-decoration: none; display: inline-block;
        }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-block { background: #e67e22; color: white; }
        .btn-make-admin { background: #f1c40f; color: #1b4f72; }
        .btn-remove-admin { background: #95a5a6; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        
        .btn-action:hover { opacity: 0.85; transform: translateY(-1px); }

        .loading-row { text-align: center; padding: 30px; opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">Lade...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-card">
            <h1>🛠 Admin Dashboard</h1>
            
            <div class="section">
                <h2>Nutzerverwaltung & Rechte</h2>
                <div class="table-responsive">
                    <table id="user-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>E-Mail</th>
                                <th>Freigabe</th>
                                <th>Rolle</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            <tr><td colspan="5" class="loading-row">Lade registrierte Nutzer...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            getDoc, 
            updateDoc, 
            deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentAdminUid = null;
        const SUPERADMIN_EMAIL = 'julianknuhr92@gmail.com';

        // ── AUTH CHECK ──
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentAdminUid = user.uid;
            const userDoc = await getDoc(doc(db, "users", user.uid));

            if (userDoc.exists()) {
                const data = userDoc.data();
                if (!data.isAdmin) {
                    alert("Zugriff verweigert: Du bist kein Administrator.");
                    window.location.href = 'start.html';
                    return;
                }
                document.getElementById('user-name').textContent = data.name || data.email;
                startUserListener();
            } else {
                window.location.href = 'login.html';
            }
        });

        // ── LIVE USER LISTE ──
        function startUserListener() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Keine Nutzer gefunden.</td></tr>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    const uid = docSnap.id;
                    const isSuperadmin = (u.email === SUPERADMIN_EMAIL);

                    const tr = document.createElement('tr');

                    // Status Badge
                    const statusBadge = u.isApproved 
                        ? '<span class="badge badge-active">Aktiv</span>' 
                        : '<span class="badge badge-blocked">Gesperrt / Warten</span>';

                    // Rollen Badge
                    const roleBadge = u.isAdmin 
                        ? '<span class="badge badge-admin">👑 Admin</span>' 
                        : '<span class="badge badge-user">Student</span>';

                    // Toggle Freigabe Button
                    const toggleApproveBtn = u.isApproved 
                        ? `<button class="btn-action btn-block" onclick="toggleApproval('${uid}', false)">Sperren</button>`
                        : `<button class="btn-action btn-approve" onclick="toggleApproval('${uid}', true)">Freischalten</button>`;

                    // Toggle Admin Button
                    let toggleAdminBtn = '';
                    if (!isSuperadmin) {
                        toggleAdminBtn = u.isAdmin 
                            ? `<button class="btn-action btn-remove-admin" onclick="toggleAdminRole('${uid}', false)">Admin entziehen</button>`
                            : `<button class="btn-action btn-make-admin" onclick="toggleAdminRole('${uid}', true)">Zum Admin machen</button>`;
                    } else {
                        toggleAdminBtn = `<span style="font-size:12px; opacity:0.6; margin-right:5px;">(Haupt-Admin)</span>`;
                    }

                    // Delete Button
                    const deleteBtn = !isSuperadmin 
                        ? `<button class="btn-action btn-delete" onclick="deleteUser('${uid}', '${u.name || u.email}')">Löschen</button>`
                        : '';

                    tr.innerHTML = `
                        <td><strong>${escapeHtml(u.name || '–')}</strong></td>
                        <td>${escapeHtml(u.email || '–')}</td>
                        <td>${statusBadge}</td>
                        <td>${roleBadge}</td>
                        <td>
                            ${toggleApproveBtn}
                            ${toggleAdminBtn}
                            ${deleteBtn}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }, (error) => {
                console.error("Fehler beim Laden der Nutzer:", error);
                document.getElementById('user-list-body').innerHTML = 
                    '<tr><td colspan="5" style="color:#ff6b6b; text-align:center;">Fehler beim Laden: ' + error.message + '</td></tr>';
            });
        }

        // ── AKTIONEN ──
        window.toggleApproval = async (uid, newStatus) => {
            try {
                await updateDoc(doc(db, "users", uid), { isApproved: newStatus });
            } catch (err) {
                alert("Fehler beim Ändern des Status: " + err.message);
            }
        };

        window.toggleAdminRole = async (uid, makeAdmin) => {
            const confirmMsg = makeAdmin 
                ? "Soll dieser Nutzer wirklich zum Administrator ernannt werden?"
                : "Sollen diesem Nutzer die Administrator-Rechte entzogen werden?";

            if (!confirm(confirmMsg)) return;

            try {
                await updateDoc(doc(db, "users", uid), { isAdmin: makeAdmin });
            } catch (err) {
                alert("Fehler beim Ändern der Admin-Rechte: " + err.message);
            }
        };

        window.deleteUser = async (uid, userName) => {
            if (!confirm(`Nutzer "${userName}" wirklich aus Firestore löschen?`)) return;

            try {
                await deleteDoc(doc(db, "users", uid));
            } catch (err) {
                alert("Fehler beim Löschen: " + err.message);
            }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');

        function escapeHtml(text) {
            const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
