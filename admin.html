<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel – SpickerSeite</title>
    <style>
        /* ── DESIGN (Admin-Style) ── */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1b4f72; 
            color: white;
            padding: 40px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 1100px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 { border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 10px; margin-top: 40px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th { background: rgba(255, 255, 255, 0.1); }

        .btn-action {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-approve { background: #2ecc71; color: white; }
        .btn-block { background: #f39c12; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-console { background: #3498db; color: white; } 
        
        .btn-action:hover { opacity: 0.8; transform: scale(1.05); }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-active { background: #2ecc71; color: white; }
        .status-blocked { background: #e74c3c; color: white; }

        .form-group { margin-top: 30px; display: flex; gap: 10px; }
        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #loading-text { text-align: center; padding: 20px; font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>🛠 Admin Dashboard</h1>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="start.html" style="color: #5dade2; text-decoration: none; font-weight: bold;">← Zurück zur Startseite</a>
            <a href="https://console.firebase.google.com/project/spickersite/authentication/users" target="_blank" style="color: #aed6f1; font-size: 14px; text-decoration: underline;">Direkt zur Firebase Auth-Konsole ↗</a>
        </div>

        <div class="section">
            <h2>Nutzerverwaltung</h2>
            <div id="loading-text">Daten werden geladen...</div>
            <table id="user-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>E-Mail</th>
                        <th>Status</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="user-list-body">
                    <!-- Nutzer werden hier geladen -->
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>Neues Fach hinzufügen</h2>
            <div class="form-group">
                <input type="text" id="new-subject-name" placeholder="z.B. Mathematik 1">
                <input type="text" id="new-subject-info" placeholder="Kurzinfo zum Fach">
                <button class="btn-add" onclick="addSubject()">Hinzufügen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || !userDoc.data().isAdmin) {
                alert("Zugriff verweigert!");
                window.location.href = 'start.html';
            } else {
                loadUsers();
            }
        });

        async function loadUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = "";
                
                querySnapshot.forEach((user) => {
                    const data = user.data();
                    if (data.email === 'julianknuhr92@gmail.com') return; 

                    const statusBadge = data.isApproved 
                        ? '<span class="status-badge status-active">Aktiv</span>' 
                        : '<span class="status-badge status-blocked">Gesperrt</span>';

                    const actionBtn = data.isApproved
                        ? `<button class="btn-action btn-block" onclick="toggleUserStatus('${user.id}', false)">Sperren</button>`
                        : `<button class="btn-action btn-approve" onclick="toggleUserStatus('${user.id}', true)">Freischalten</button>`;

                    const consoleLink = `https://console.firebase.google.com/project/spickersite/authentication/users`;

                    tbody.innerHTML += `
                        <tr>
                            <td>${data.name || 'Kein Name'}</td>
                            <td>${data.email}</td>
                            <td>${statusBadge}</td>
                            <td>
                                ${actionBtn}
                                <button class="btn-action btn-delete" onclick="deleteUser('${user.id}')">Löschen</button>
                                <a href="${consoleLink}" target="_blank" class="btn-action btn-console">Auth-Konsole ↗</a>
                            </td>
                        </tr>
                    `;
                });
                
                document.getElementById('loading-text').style.display = "none";
                document.getElementById('user-table').style.display = "table";
            } catch (error) {
                console.error("Fehler beim Laden:", error);
                document.getElementById('loading-text').textContent = "Fehler beim Laden der Daten.";
            }
        }

        window.toggleUserStatus = async (uid, newStatus) => {
            const userRef = doc(db, "users", uid);
            await updateDoc(userRef, { isApproved: newStatus });
            loadUsers();
        };

        window.deleteUser = async (uid) => {
            if (confirm("Firestore-Daten löschen? \n\nWICHTIG: Klicke danach auf den blauen Button 'Auth-Konsole', um das Konto dort endgültig zu löschen, damit die E-Mail für eine Neuregistrierung frei wird.")) {
                await deleteDoc(doc(db, "users", uid));
                loadUsers();
            }
        };

        window.addSubject = async () => {
            const name = document.getElementById('new-subject-name').value;
            const info = document.getElementById('new-subject-info').value;
            if(!name) return;
            await setDoc(doc(collection(db, "subjects")), { name, info });
            alert("Fach hinzugefügt!");
            document.getElementById('new-subject-name').value = "";
            document.getElementById('new-subject-info').value = "";
        };
    </script>
</body>
</html>
