<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel – SpickerSeite</title>
    <style>
        /* ── NAVBAR STYLE (Exakt wie start.html) ── */
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #1b4f72; color: white; min-height: 100vh;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; cursor: pointer; }
        .admin-btn { color: #ffeb3b !important; } /* Hier immer sichtbar, da Admin-Seite */

        /* ── ADMIN CONTENT ── */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .admin-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h2 { border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 10px; margin-top: 40px; }
        table {
            width: 100%; border-collapse: collapse; margin-top: 20px;
            background: rgba(0, 0, 0, 0.2); border-radius: 10px; overflow: hidden;
        }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background: rgba(255, 255, 255, 0.1); }
        .btn-action {
            padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer;
            font-weight: bold; font-size: 12px; margin-right: 5px; transition: 0.2s;
            text-decoration: none; display: inline-block; text-align: center;
        }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-block { background: #f39c12; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-console { background: #3498db; color: white; } 
        .btn-action:hover { opacity: 0.8; transform: scale(1.05); }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-active { background: #2ecc71; color: white; }
        .status-blocked { background: #e74c3c; color: white; }
        .form-group { margin-top: 30px; display: flex; gap: 10px; }
        input { padding: 12px; border-radius: 8px; border: none; flex: 1; background: rgba(255, 255, 255, 0.9); color: #333; }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-card">
            <h1>🛠 Admin Dashboard</h1>
            <div class="section">
                <h2>Nutzerverwaltung</h2>
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>E-Mail</th>
                            <th>Status</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <tr><td colspan="4" style="text-align:center;">Lade Nutzer...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- ... Rest der Admin-Sektion ... -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* Deine Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                if (!data.isAdmin) { window.location.href = 'start.html'; return; }
                document.getElementById('user-name').textContent = data.name;
                startUserListener();
            }
        });

        // ... (Restliche Admin-Funktionen: startUserListener, toggleUserStatus, deleteUser, addSubject) ...
        
        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
