<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fachdetails – SpickerSeite</title>
    <style>
        /* ── NAVBAR STYLE (Exakt wie start.html) ── */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        /* ── CONTENT ── */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-download {
            background: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name">Lade Fach...</h1>
            <div id="exam-list">
                <!-- Klausuren werden hier geladen -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* Deine Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('user-name').textContent = data.name;
                if (data.isAdmin) document.getElementById('admin-link').style.display = 'inline';
                loadExams(data.isAdmin);
            }
        });

        // ... (Restliche Funktionen: loadExams, deleteExam) ...

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
