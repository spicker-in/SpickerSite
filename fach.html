<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fachdetails – SpickerSeite</title>
    <style>
        /* ── NAVBAR STYLE (Konsistent) ── */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        /* ── CONTENT ── */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .exam-list {
            margin-top: 20px;
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

            .exam-item:hover {
                background: rgba(255, 255, 255, 0.2);
            }

        .exam-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pdf-icon {
            font-size: 24px;
        }

        .btn-download {
            background: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

            .btn-download:hover {
                transform: scale(1.05);
                background: #27ae60;
            }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-left: 10px;
            display: none;
            font-weight: bold;
        }

            .btn-delete:hover {
                background: #c0392b;
            }

        .empty-msg {
            text-align: center;
            opacity: 0.6;
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name">Lade Fach...</h1>
            <div id="exam-list" class="exam-list">
                <!-- Klausuren werden hier geladen -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('user-name').textContent = data.name;

                if (data.isAdmin) {
                    document.getElementById('admin-link').style.display = 'inline';
                }

                loadSubjectDetails(data.isAdmin);
            }
        });

        // Fachname und Klausuren laden
        async function loadSubjectDetails(isAdmin) {
            if (!subjectId) return;

            // 1. Fachname holen
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) {
                document.getElementById('subject-name').textContent = sDoc.data().name;
            }

            // 2. Echtzeit-Listener für Klausuren dieses Fachs
            const q = query(collection(db, "exams"), where("subjectId", "==", subjectId));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('exam-list');
                list.innerHTML = "";

                if (snapshot.empty) {
                    list.innerHTML = '<p class="empty-msg">Noch keine Altklausuren für dieses Fach hochgeladen.</p>';
                    return;
                }

                snapshot.forEach((d) => {
                    const exam = d.data();
                    const item = document.createElement('div');
                    item.className = 'exam-item';

                    item.innerHTML = `
                            <div class="exam-info">
                                <span class="pdf-icon">📄</span>
                                <span>${exam.fileName}</span>
                            </div>
                            <div>
                                <a href="${exam.url}" target="_blank" class="btn-download">Download</a>
                                <button class="btn-delete" id="del-${d.id}" onclick="deleteExam('${d.id}')">Löschen</button>
                            </div>
                        `;
                    list.appendChild(item);

                    // Löschen-Button nur für Admins zeigen
                    if (isAdmin) {
                        document.getElementById(`del-${d.id}`).style.display = 'inline-block';
                    }
                });
            });
        }

        // Admin-Funktion: Klausur löschen
        window.deleteExam = async (examId) => {
            if (confirm("Möchtest du diese Altklausur wirklich löschen?")) {
                try {
                    await deleteDoc(doc(db, "exams", examId));
                    // Hinweis: Das Dokument wird aus Firestore gelöscht.
                    // Die Datei im Storage bleibt technisch da, aber der Link ist weg.
                } catch (e) {
                    alert("Fehler beim Löschen: " + e.message);
                }
            }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
