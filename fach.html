<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altklausuren – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-download {
            background: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            display: none;
        }

        .back-link {
            color: #5dade2;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="start.html" class="back-link">← Zurück zur Übersicht</a>
        <div class="glass-card">
            <h1 id="subject-name">Lade Fach...</h1>
            <div id="exam-list">
                <!-- Klausuren werden hier geladen -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* Deine Config wie oben */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { location.href='login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            const isAdmin = userDoc.data().isAdmin;
            loadExams(isAdmin);
        });

        async function loadExams(isAdmin) {
            // Fachname holen
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            document.getElementById('subject-name').textContent = sDoc.data().name;

            // Klausuren holen
            const q = query(collection(db, "exams"), where("subjectId", "==", subjectId));
            const snap = await getDocs(q);
            const list = document.getElementById('exam-list');
            list.innerHTML = snap.empty ? "<p>Noch keine Altklausuren vorhanden.</p>" : "";

            snap.forEach(d => {
                const exam = d.data();
                const item = document.createElement('div');
                item.className = 'exam-item';
                item.innerHTML = `
                    <span>📄 ${exam.fileName}</span>
                    <div>
                        <a href="${exam.url}" target="_blank" class="btn-download">Download</a>
                        <button class="btn-delete" id="del-${d.id}" onclick="deleteExam('${d.id}')">Löschen</button>
                    </div>
                `;
                list.appendChild(item);
                if (isAdmin) document.getElementById(`del-${d.id}`).style.display = 'inline-block';
            });
        }

        window.deleteExam = async (id) => {
            if (confirm("Wirklich löschen?")) {
                await deleteDoc(doc(db, "exams", id));
                location.reload();
            }
        };
    </script>
</body>
</html>
