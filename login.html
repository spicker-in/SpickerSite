<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SpickerSeite </title>
    <style>
        /* ... (Design bleibt identisch wie in deinem Code) ... */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .tab-container {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            margin-bottom: 30px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

            .tab.active {
                background: linear-gradient(135deg, #5dade2, #2e86c1);
                box-shadow: 0 4px 15px rgba(46, 134, 193, 0.4);
            }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: #000000;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
        }

            input::placeholder {
                color: rgba(0, 0, 0, 0.5);
            }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #aed6f1, #5dade2);
            border: none;
            border-radius: 50px;
            color: #1b4f72;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        .footer-text {
            font-size: 12px;
            margin-top: 20px;
            opacity: 0.6;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>SpickerSeite</h1>
        <div class="tab-container">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">🔑 Anmelden</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">📝 Registrieren</div>
        </div>
        <div id="error-box" class="error-msg"></div>
        <input type="text" id="name-field" placeholder="Name" style="display: none;">
        <input type="email" id="email-field" placeholder="E-Mail (z.B. mayerma@th-nuernberg.de)">
        <input type="password" id="pass-field" placeholder="Passwort">
        <button class="btn-submit" id="submit-btn" onclick="handleAuth()">Anmelden</button>
        <p class="footer-text">Nur für Studenten der TH Nürnberg<br> © 2026</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let mode = 'login';

        window.switchTab = (newMode) => {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('name-field').style.display = (mode === 'register') ? 'block' : 'none';
            document.getElementById('submit-btn').textContent = (mode === 'login') ? 'Anmelden' : 'Registrieren';
            document.getElementById('error-box').style.display = 'none';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email-field').value.trim();
            const pass = document.getElementById('pass-field').value;
            const name = document.getElementById('name-field').value;
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            if (mode === 'register') {
                const isTHN = email.endsWith('@th-nuernberg.de');
                const isAdminEmail = (email === 'julianknuhr92@gmail.com');

                if (!isTHN && !isAdminEmail) {
                    errorBox.textContent = "Nur E-Mails der @th-nuernberg.de sind erlaubt!";
                    errorBox.style.display = 'block';
                    return;
                }

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    const user = userCredential.user;

                    // 1. Verifizierungs-E-Mail senden
                    await sendEmailVerification(user);

                    // 2. User in Firestore speichern
                    await setDoc(doc(db, "users", user.uid), {
                        name: name,
                        email: email,
                        isAdmin: isAdminEmail,
                        isApproved: true,
                        createdAt: new Date()
                    });

                    alert("Registrierung fast fertig! Wir haben dir eine Bestätigungs-E-Mail gesendet. Bitte klicke auf den Link in der Mail, um dein Konto zu aktivieren.");

                    // Sofort wieder ausloggen, damit man sich erst nach Verifizierung einloggen kann
                    await signOut(auth);
                    location.reload();

                } catch (error) {
                    errorBox.textContent = "Fehler: " + error.message;
                    errorBox.style.display = 'block';
                }
            } else {
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                    const user = userCredential.user;

                    // PRÜFUNG: Ist die E-Mail bestätigt?
                    if (!user.emailVerified) {
                        errorBox.textContent = "Bitte bestätige erst deine E-Mail-Adresse! Schau in dein Postfach.";
                        errorBox.style.display = 'block';
                        await signOut(auth); // Wieder ausloggen
                        return;
                    }

                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        window.location.href = 'start.html';
                    }
                } catch (error) {
                    errorBox.textContent = "Login fehlgeschlagen. Prüfe E-Mail und Passwort.";
                    errorBox.style.display = 'block';
                }
            }
        };
    </script>
</body>
</html>
