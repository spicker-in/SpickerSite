<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SpickerSeite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 30px;
            margin: 0 0 20px 0;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .tab-container {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            margin-bottom: 25px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }

            .tab.active {
                background: linear-gradient(135deg, #5dade2, #2e86c1);
                color: white;
                box-shadow: 0 4px 15px rgba(46, 134, 193, 0.4);
            }

        .input-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: #1a252f;
            font-size: 15px;
            outline: none;
        }

            input:focus {
                background: #fff;
                border-color: #5dade2;
                box-shadow: 0 0 0 3px rgba(93, 173, 226, 0.35);
            }

        .input-password-wrap input {
            padding-right: 42px;
        }

        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #555;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7fb3d5, #2980b9);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

            .btn-submit:hover {
                transform: translateY(-2px);
            }

            .btn-submit:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

        .forgot-link {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
            cursor: pointer;
        }

        .msg-box {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
            line-height: 1.4;
        }

            .msg-box.error {
                background: rgba(231, 76, 60, 0.85);
                color: white;
                display: block;
            }

            .msg-box.warning {
                background: rgba(243, 156, 18, 0.85);
                color: white;
                display: block;
            }

            .msg-box.success {
                background: rgba(46, 204, 113, 0.85);
                color: white;
                display: block;
            }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: rgba(27, 79, 114, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            color: white;
            text-align: center;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>SpickerSeite</h1>

        <div id="auto-login-overlay">
            <div class="spinner"></div>
            <p style="font-size: 14px;">Sitzung wird überprüft...</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="tab-container">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">🔑 Anmelden</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">📝 Registrieren</div>
            </div>

            <div id="status-box" class="msg-box"></div>

            <!-- ANMELDEN -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="E-Mail (z.B. mustermann@th-nuernberg.de)" required autocomplete="email">
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="login-pass" placeholder="Passwort" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('login-pass', this)">👁️</button>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">Anmelden</button>
                <div>
                    <a class="forgot-link" onclick="openForgotModal()">Passwort vergessen?</a>
                </div>
            </form>

            <!-- REGISTRIEREN -->
            <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="text" id="reg-name" placeholder="Vollständiger Name" required autocomplete="name">
                </div>
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="E-Mail (z.B. @th-nuernberg.de)" required autocomplete="email">
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="reg-pass" placeholder="Passwort (mind. 6 Zeichen)" required autocomplete="new-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('reg-pass', this)">👁️</button>
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="reg-pass-repeat" placeholder="Passwort wiederholen" required autocomplete="new-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('reg-pass-repeat', this)">👁️</button>
                </div>
                <button type="submit" class="btn-submit" id="reg-btn">Registrieren</button>
            </form>

            <p style="font-size: 12px; margin-top: 25px; opacity: 0.75;">SpickerSeite TH Nürnberg © 2026</p>
        </div>
    </div>

    <!-- MODAL PASSWORT VERGESSEN -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>🔒 Passwort vergessen?</h2>
            <p style="font-size: 13px; opacity: 0.85; margin-bottom: 15px;">
                Gib deine registrierte E-Mail-Adresse ein. Firebase sendet dir direkt einen Link zum Zurücksetzen:
            </p>
            <div id="forgot-msg" class="msg-box"></div>
            <input type="email" id="forgot-email" placeholder="E-Mail-Adresse" style="margin-bottom: 12px;">
            <button type="button" class="btn-submit" id="btn-forgot-submit" onclick="handleForgotPassword()">Reset-Link anfordern</button>
            <button type="button" class="btn-cancel" onclick="closeForgotModal()">Schließen</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        auth.languageCode = 'de';

        const SUPERADMIN_EMAIL = 'julianknuhr92@gmail.com';

        let isRegistering = false;

        // AUTO-LOGIN CHECK -> Immer auf start.html weiterleiten
        onAuthStateChanged(auth, async (user) => {
            if (isRegistering) return;

            if (user) {
                const isSuperAdmin = (user.email && user.email.toLowerCase() === SUPERADMIN_EMAIL);
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        if (!data.isApproved && !isSuperAdmin) {
                            await signOut(auth);
                            showWarning("⏳ Dein Account wartet noch auf die Freischaltung durch den Administrator.");
                            showForm();
                            return;
                        }

                        // JEDER freigeschaltete User (inkl. Admin) geht zuerst auf start.html
                        window.location.href = 'start.html';
                        return;
                    }
                } catch (e) {
                    console.error("Auto-Login Fehler:", e);
                }
            }
            showForm();
        });

        function showForm() {
            document.getElementById('auto-login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        window.switchTab = (mode) => {
            clearMessages();
            const isLogin = (mode === 'login');
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
        };

        window.togglePassword = (fieldId, btn) => {
            const input = document.getElementById(fieldId);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.textContent = input.type === 'password' ? '👁️' : '🔒';
        };

        function showError(msg, targetId = 'status-box') {
            const box = document.getElementById(targetId);
            box.innerHTML = msg;
            box.className = 'msg-box error';
        }
        function showWarning(msg, targetId = 'status-box') {
            const box = document.getElementById(targetId);
            box.innerHTML = msg;
            box.className = 'msg-box warning';
        }
        function showSuccess(msg, targetId = 'status-box') {
            const box = document.getElementById(targetId);
            box.innerHTML = msg;
            box.className = 'msg-box success';
        }
        function clearMessages() {
            const box = document.getElementById('status-box');
            box.className = 'msg-box';
            box.textContent = '';
        }

        function mapAuthError(errCode) {
            switch (errCode) {
                case 'auth/invalid-email': return 'Ungültiges E-Mail-Format.';
                case 'auth/user-not-found': return 'Kein Account mit dieser E-Mail-Adresse gefunden.';
                case 'auth/wrong-password':
                case 'auth/invalid-credential': return 'E-Mail oder Passwort ist falsch.';
                case 'auth/email-already-in-use': return 'Diese E-Mail ist bereits registriert.';
                case 'auth/weak-password': return 'Das Passwort muss mindestens 6 Zeichen lang sein.';
                case 'auth/too-many-requests': return 'Zu viele Versuche. Bitte kurz warten.';
                default: return 'Fehler: ' + errCode;
            }
        }

        // LOGIN -> Immer auf start.html weiterleiten
        window.handleLogin = async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Wird angemeldet...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                const isSuperAdmin = (email.toLowerCase() === SUPERADMIN_EMAIL);

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    if (!data.isApproved && !isSuperAdmin) {
                        showWarning("⏳ <strong>Account noch nicht freigeschaltet.</strong><br>Der Administrator muss deinen Account erst freischalten.");
                        await signOut(auth);
                        return;
                    }
                    // Immer auf start.html weiterleiten
                    window.location.href = 'start.html';
                } else {
                    if (isSuperAdmin) {
                        window.location.href = 'start.html';
                    } else {
                        showError("Nutzerdaten nicht in der Datenbank gefunden.");
                        await signOut(auth);
                    }
                }
            } catch (err) {
                showError(mapAuthError(err.code));
            } finally {
                btn.disabled = false;
                btn.textContent = 'Anmelden';
            }
        };

        // REGISTRIERUNG
        window.handleRegister = async (e) => {
            e.preventDefault();
            clearMessages();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const passRepeat = document.getElementById('reg-pass-repeat').value;
            const btn = document.getElementById('reg-btn');

            const isTHN = email.endsWith('@th-nuernberg.de');
            const isSuperAdmin = (email === SUPERADMIN_EMAIL);
            const autoApproved = isTHN || isSuperAdmin;

            if (pass.length < 6) {
                showError("Das Passwort muss mindestens 6 Zeichen lang sein.");
                return;
            }
            if (pass !== passRepeat) {
                showError("Die Passwörter stimmen nicht überein!");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Erstelle Account...';
            isRegistering = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // In Firestore anlegen
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    isAdmin: isSuperAdmin,
                    isApproved: autoApproved,
                    createdAt: new Date()
                });

                if (isSuperAdmin) {
                    showSuccess("👑 Admin-Account erstellt! Weiterleitung zur Startseite...");
                    setTimeout(() => window.location.href = 'start.html', 1500);
                } else if (isTHN) {
                    showSuccess("✅ <strong>Registrierung erfolgreich!</strong><br>Als TH-Student bist du sofort freigeschaltet.");
                    await signOut(auth);
                    document.getElementById('form-register').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    showWarning("📝 <strong>Registrierung eingegangen!</strong><br>Der Admin schaltet deinen Account in Kürze frei. Du erhältst dann eine Freischaltungs-Mail.");
                    await signOut(auth);
                    document.getElementById('form-register').reset();
                    setTimeout(() => switchTab('login'), 4000);
                }
            } catch (err) {
                showError(mapAuthError(err.code));
            } finally {
                isRegistering = false;
                btn.disabled = false;
                btn.textContent = 'Registrieren';
            }
        };

        // PASSWORT ZURÜCKSETZEN
        window.openForgotModal = () => {
            const loginMail = document.getElementById('login-email').value;
            if (loginMail) document.getElementById('forgot-email').value = loginMail;
            document.getElementById('forgot-msg').className = 'msg-box';
            document.getElementById('forgot-msg').textContent = '';
            document.getElementById('forgot-modal').style.display = 'flex';
        };
        window.closeForgotModal = () => {
            document.getElementById('forgot-modal').style.display = 'none';
        };

        window.handleForgotPassword = async () => {
            const email = document.getElementById('forgot-email').value.trim().toLowerCase();
            if (!email) {
                showError("Bitte gib deine E-Mail-Adresse ein.", 'forgot-msg');
                return;
            }

            const btn = document.getElementById('btn-forgot-submit');
            btn.disabled = true;
            btn.textContent = 'Wird gesendet...';

            try {
                // Sauberer, direkter Aufruf (vermeidet unauthorized-continue-uri)
                await sendPasswordResetEmail(auth, email);

                showSuccess("✅ Firebase hat eine E-Mail zum Zurücksetzen gesendet! Bitte prüfe deinen Posteingang und Spam-Ordner.", 'forgot-msg');
                setTimeout(() => closeForgotModal(), 4000);
            } catch (err) {
                console.error("Firebase Reset Fehler:", err);
                if (err.code === 'auth/user-not-found') {
                    showError("Es existiert kein Account mit dieser E-Mail-Adresse in Firebase.", 'forgot-msg');
                } else {
                    showError(mapAuthError(err.code) || err.message, 'forgot-msg');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset-Link anfordern';
            }
        };
    </script>
</body>
</html>
