<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SpickerSeite</title>
    <style>
        /* ── DESIGN (Glassmorphism) ── */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 30px;
            margin: 0 0 20px 0;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* ── TABS ── */
        .tab-container {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            margin-bottom: 25px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.8);
            user-select: none;
        }

            .tab.active {
                background: linear-gradient(135deg, #5dade2, #2e86c1);
                color: white;
                box-shadow: 0 4px 15px rgba(46, 134, 193, 0.4);
            }

        /* ── INPUTS & WRAPPER ── */
        .input-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: #1a252f;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

            input:focus {
                background: #ffffff;
                border-color: #5dade2;
                box-shadow: 0 0 0 3px rgba(93, 173, 226, 0.35);
            }

            input::placeholder {
                color: rgba(0, 0, 0, 0.5);
                font-size: 14px;
            }

        .input-password-wrap {
            position: relative;
        }

            .input-password-wrap input {
                padding-right: 42px;
            }

        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #555;
            padding: 0;
            outline: none;
        }

        /* ── BUTTONS & LINKS ── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7fb3d5, #2980b9);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
            }

            .btn-submit:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

        .forgot-link {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
        }

            .forgot-link:hover {
                color: #aed6f1;
            }

        /* ── MESSAGES ── */
        .msg-box {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
            line-height: 1.4;
        }

            .msg-box.error {
                background: rgba(231, 76, 60, 0.25);
                border: 1px solid rgba(231, 76, 60, 0.5);
                color: #ffd2d2;
                display: block;
            }

            .msg-box.success {
                background: rgba(46, 204, 113, 0.25);
                border: 1px solid rgba(46, 204, 113, 0.5);
                color: #d4efdf;
                display: block;
            }

        .footer-text {
            font-size: 12px;
            margin-top: 25px;
            opacity: 0.75;
            line-height: 1.5;
        }

        /* ── AUTO-LOGIN OVERLAY ── */
        #auto-login-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 10px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ── MODAL (Passwort vergessen) ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: rgba(27, 79, 114, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

            .modal-card h2 {
                margin-top: 0;
                font-size: 20px;
            }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>SpickerSeite</h1>

        <!-- Lade-Status beim automatischen Login-Check -->
        <div id="auto-login-overlay">
            <div class="spinner"></div>
            <p style="font-size: 14px; margin: 0;">Sitzung wird überprüft...</p>
        </div>

        <!-- Regulärer Inhalt (wird nach Check eingeblendet) -->
        <div id="main-content" style="display: none;">

            <div class="tab-container">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">🔑 Anmelden</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">📝 Registrieren</div>
            </div>

            <!-- Benachrichtigungs- / Fehlerbox -->
            <div id="status-box" class="msg-box"></div>

            <!-- FORMULAR: ANMELDEN -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="E-Mail (z.B. mayerma@th-nuernberg.de)" required autocomplete="email">
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="login-pass" placeholder="Passwort" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('login-pass', this)">👁️</button>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">Anmelden</button>
                <div>
                    <a class="forgot-link" onclick="openForgotModal()">Passwort vergessen?</a>
                </div>
            </form>

            <!-- FORMULAR: REGISTRIEREN -->
            <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="text" id="reg-name" placeholder="Vollständiger Name" required autocomplete="name">
                </div>
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="TH-Mail (@th-nuernberg.de)" required autocomplete="email">
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="reg-pass" placeholder="Passwort (mind. 6 Zeichen)" required autocomplete="new-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('reg-pass', this)">👁️</button>
                </div>
                <div class="input-group input-password-wrap">
                    <input type="password" id="reg-pass-repeat" placeholder="Passwort wiederholen" required autocomplete="new-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('reg-pass-repeat', this)">👁️</button>
                </div>
                <button type="submit" class="btn-submit" id="reg-btn">Registrieren</button>
            </form>

            <p class="footer-text">Nur für Studenten der TH Nürnberg<br>© 2026</p>
        </div>
    </div>

    <!-- MODAL: PASSWORT VERGESSEN -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>🔒 Passwort zurücksetzen</h2>
            <p style="font-size: 13px; opacity: 0.85; margin-bottom: 15px;">
                Gib deine E-Mail-Adresse ein. Firebase sendet dir einen sicheren Link zum Zurücksetzen.
            </p>
            <div id="forgot-msg" class="msg-box"></div>
            <input type="email" id="forgot-email" placeholder="E-Mail-Adresse" style="margin-bottom: 12px;">
            <button type="button" class="btn-submit" onclick="handleForgotPassword()">Link senden</button>
            <button type="button" class="btn-cancel" onclick="closeForgotModal()">Abbrechen</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendEmailVerification,
            sendPasswordResetEmail,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        auth.languageCode = 'de';

        const SUPERADMIN_EMAIL = 'julianknuhr92@gmail.com';

        // ── AUTOMATISCHER LOGIN CHECK ──
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isSuperAdmin = (user.email && user.email.toLowerCase() === SUPERADMIN_EMAIL);

                // Falls E-Mail nicht verifiziert und kein SuperAdmin -> ausloggen & Login anzeigen
                if (!user.emailVerified && !isSuperAdmin) {
                    await signOut(auth);
                    showForm();
                    return;
                }

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();

                        // Weiterleitung je nach Rolle
                        if (data.isAdmin || isSuperAdmin) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'start.html';
                        }
                        return;
                    }
                } catch (e) {
                    console.error("Auto-Login Fehler:", e);
                }
            }

            // Kein aktiver User -> Formular anzeigen
            showForm();
        });

        function showForm() {
            document.getElementById('auto-login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        // ── TAB WECHSELN ──
        window.switchTab = (mode) => {
            clearMessages();
            const isLogin = (mode === 'login');

            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);

            document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
        };

        // ── PASSWORT ANZEIGEN / VERBERGEN ──
        window.togglePassword = (fieldId, btn) => {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔒';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        };

        // ── FEEDBACK-BOXEN ──
        function showError(msg, targetId = 'status-box') {
            const box = document.getElementById(targetId);
            box.innerHTML = msg;
            box.className = 'msg-box error';
        }

        function showSuccess(msg, targetId = 'status-box') {
            const box = document.getElementById(targetId);
            box.innerHTML = msg;
            box.className = 'msg-box success';
        }

        function clearMessages() {
            const box = document.getElementById('status-box');
            box.className = 'msg-box';
            box.textContent = '';
        }

        function mapAuthError(errCode) {
            switch (errCode) {
                case 'auth/invalid-email': return 'Ungültiges E-Mail-Format.';
                case 'auth/user-not-found': return 'Kein Nutzer mit dieser E-Mail gefunden.';
                case 'auth/wrong-password':
                case 'auth/invalid-credential': return 'E-Mail oder Passwort ist falsch.';
                case 'auth/email-already-in-use': return 'Diese E-Mail ist bereits registriert.';
                case 'auth/weak-password': return 'Das Passwort muss mindestens 6 Zeichen lang sein.';
                case 'auth/too-many-requests': return 'Zu viele Versuche. Bitte kurz warten.';
                default: return 'Fehler: ' + errCode;
            }
        }

        // ── LOGIN HANDLER ──
        window.handleLogin = async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Wird angemeldet...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                const isSuperAdmin = (email.toLowerCase() === SUPERADMIN_EMAIL);

                // 1. E-Mail Verifikation prüfen
                if (!user.emailVerified && !isSuperAdmin) {
                    showError(`
                            Bitte bestätige erst deine E-Mail-Adresse!<br>
                            <small>Keine Mail erhalten? <a href="#" id="resend-mail-btn" style="color:#fff; font-weight:bold; text-decoration:underline;">Erneut senden</a></small>
                        `);

                    document.getElementById('resend-mail-btn').onclick = async (ev) => {
                        ev.preventDefault();
                        try {
                            await sendEmailVerification(user);
                            alert("Bestätigungs-Mail wurde erneut an " + email + " versendet.");
                        } catch (resendErr) {
                            alert("Fehler beim Senden: " + resendErr.message);
                        }
                    };

                    await signOut(auth);
                    return;
                }

                // 2. Benutzerdaten & Admin-Rolle abrufen
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    if (data.isAdmin || isSuperAdmin) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'start.html';
                    }
                } else {
                    window.location.href = isSuperAdmin ? 'admin.html' : 'start.html';
                }

            } catch (err) {
                showError(mapAuthError(err.code));
            } finally {
                btn.disabled = false;
                btn.textContent = 'Anmelden';
            }
        };

        // ── REGISTRIERUNG HANDLER ──
        window.handleRegister = async (e) => {
            e.preventDefault();
            clearMessages();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const passRepeat = document.getElementById('reg-pass-repeat').value;
            const btn = document.getElementById('reg-btn');

            const isTHN = email.endsWith('@th-nuernberg.de');
            const isSuperAdmin = (email === SUPERADMIN_EMAIL);

            if (!isTHN && !isSuperAdmin) {
                showError("Nur offizielle E-Mails der @th-nuernberg.de sind zugelassen!");
                return;
            }

            if (pass.length < 6) {
                showError("Das Passwort muss mindestens 6 Zeichen lang sein.");
                return;
            }

            if (pass !== passRepeat) {
                showError("Die Passwörter stimmen nicht überein!");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Erstelle Account...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // In Firestore anlegen
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    isAdmin: isSuperAdmin,
                    isApproved: true,
                    createdAt: new Date()
                });

                // Bestätigungs-E-Mail senden
                if (!isSuperAdmin) {
                    await sendEmailVerification(user);
                    showSuccess("Registrierung erfolgreich! Bitte klicke auf den Bestätigungslink in deiner E-Mail (auch im Spam nachsehen).");
                } else {
                    showSuccess("Admin-Account erfolgreich registriert!");
                }

                await signOut(auth);
                document.getElementById('form-register').reset();

                setTimeout(() => {
                    switchTab('login');
                }, 4000);

            } catch (err) {
                showError(mapAuthError(err.code));
            } finally {
                btn.disabled = false;
                btn.textContent = 'Registrieren';
            }
        };

        // ── PASSWORT ZURÜCKSETZEN ──
        window.openForgotModal = () => {
            const loginMail = document.getElementById('login-email').value;
            if (loginMail) document.getElementById('forgot-email').value = loginMail;
            document.getElementById('forgot-msg').className = 'msg-box';
            document.getElementById('forgot-msg').textContent = '';
            document.getElementById('forgot-modal').style.display = 'flex';
        };

        window.closeForgotModal = () => {
            document.getElementById('forgot-modal').style.display = 'none';
        };

        window.handleForgotPassword = async () => {
            const email = document.getElementById('forgot-email').value.trim();
            if (!email) {
                showError("Bitte gib deine E-Mail-Adresse ein.", 'forgot-msg');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess("E-Mail zum Zurücksetzen wurde erfolgreich gesendet!", 'forgot-msg');
                setTimeout(() => closeForgotModal(), 3500);
            } catch (err) {
                showError(mapAuthError(err.code), 'forgot-msg');
            }
        };
    </script>
</body>
</html>
