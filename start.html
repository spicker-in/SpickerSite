<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

            .nav-links a, .nav-links span {
                color: white;
                text-decoration: none;
                margin-left: 20px;
                font-weight: bold;
            }

            .nav-links a {
                cursor: pointer;
            }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* ── SUCHE ── */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto 40px auto;
        }

        .search-box {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

            .search-box::placeholder {
                color: #888;
            }

        /* ── FÄCHER GRID ── */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .subject-card:hover {
                background: rgba(255, 255, 255, 0.25);
                transform: translateY(-5px);
            }

        /* ── ADMIN BUTTON ── */
        .admin-actions {
            margin-bottom: 30px;
            display: none;
        }

        .btn-add-subject {
            background: #ffeb3b;
            color: #333;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">Laden...</span>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1>Fächer & Altklausuren</h1>

            <div class="search-container">
                <input type="text" id="search" class="search-box" placeholder="Fach suchen..." onkeyup="filterSubjects()">
            </div>

            <div class="admin-actions" id="admin-add-area">
                <button class="btn-add-subject" onclick="addNewSubject()">+ Fach hinzufügen</button>
            </div>

            <div class="subject-grid" id="subject-list">
                <!-- Fächer werden hier geladen -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allSubjects = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();

                    // WICHTIG: Check ob freigeschaltet
                    if (!data.isApproved) {
                        alert("Bitte bestätige erst deine E-Mail!");
                        signOut(auth).then(() => window.location.href = 'login.html');
                        return;
                    }

                    document.getElementById('user-name').textContent = data.name;

                    if (data.isAdmin) {
                        document.getElementById('admin-link').style.display = 'inline';
                        document.getElementById('admin-add-area').style.display = 'block';
                    }

                    listenToSubjects();
                }
            } catch (e) {
                console.error("Fehler beim Laden des Profils:", e);
            }
        });

        function listenToSubjects() {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                allSubjects = [];
                const list = document.getElementById('subject-list');
                list.innerHTML = "";

                snapshot.forEach(d => {
                    const sub = { id: d.id, ...d.data() };
                    allSubjects.push(sub);
                    const card = document.createElement('div');
                    card.className = 'subject-card';
                    card.innerHTML = `<h3>${sub.name}</h3>`;
                    card.onclick = () => window.location.href = `fach.html?id=${sub.id}`;
                    list.appendChild(card);
                });
            });
        }

        window.filterSubjects = () => {
            const term = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('subject-list');
            list.innerHTML = "";
            allSubjects.filter(s => s.name.toLowerCase().includes(term)).forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `<h3>${sub.name}</h3>`;
                card.onclick = () => window.location.href = `fach.html?id=${sub.id}`;
                list.appendChild(card);
            });
        };

        window.addNewSubject = async () => {
            const name = prompt("Name des neuen Fachs:");
            if (name && name.trim() !== "") {
                await addDoc(collection(db, "subjects"), {
                    name: name.trim(),
                    createdAt: serverTimestamp()
                });
            }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
