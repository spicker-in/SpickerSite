<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .subject-card:hover {
                background: rgba(255, 255, 255, 0.25);
                transform: translateY(-5px);
            }

        .upload-box {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        select, input[type="file"] {
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            border: none;
        }

        .btn-upload {
            background: linear-gradient(135deg, #5dade2, #2e86c1);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1>Fächer & Altklausuren</h1>
            <input type="text" id="search" class="search-box" placeholder="Nach Fach suchen..." onkeyup="filterSubjects()">

            <div class="subject-grid" id="subject-list">
                <!-- Fächer werden hier geladen -->
            </div>

            <div class="upload-box">
                <h2>Altklausur hochladen</h2>
                <select id="upload-subject"><option value="">Fach wählen...</option></select>
                <input type="file" id="upload-file" accept="application/pdf">
                <button class="btn-upload" onclick="handleUpload()">Hochladen</button>
                <p id="status"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allSubjects = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                if (!data.isApproved) { alert("Nicht freigeschaltet!"); signOut(auth); return; }
                document.getElementById('user-name').textContent = data.name;
                if (data.isAdmin) document.getElementById('admin-link').style.display = 'inline';
                loadSubjects();
            }
        });

        async function loadSubjects() {
            const snap = await getDocs(collection(db, "subjects"));
            const list = document.getElementById('subject-list');
            const select = document.getElementById('upload-subject');
            list.innerHTML = "";
            allSubjects = [];
            snap.forEach(d => {
                const sub = { id: d.id, ...d.data() };
                allSubjects.push(sub);
                list.innerHTML += `<div class="subject-card" onclick="location.href='fach.html?id=${sub.id}'"><h3>${sub.name}</h3></div>`;
                select.innerHTML += `<option value="${sub.id}">${sub.name}</option>`;
            });
        }

        window.filterSubjects = () => {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = allSubjects.filter(s => s.name.toLowerCase().includes(term));
            const list = document.getElementById('subject-list');
            list.innerHTML = filtered.map(s => `<div class="subject-card" onclick="location.href='fach.html?id=${s.id}'"><h3>${s.name}</h3></div>`).join('');
        };

        window.handleUpload = async () => {
            const file = document.getElementById('upload-file').files[0];
            const subId = document.getElementById('upload-subject').value;
            const status = document.getElementById('status');
            if (!file || !subId) return alert("Bitte alles ausfüllen!");

            status.textContent = "Upload läuft...";
            const sRef = ref(storage, `exams/${subId}/${Date.now()}_${file.name}`);
            const snap = await uploadBytes(sRef, file);
            const url = await getDownloadURL(snap.ref);

            await addDoc(collection(db, "exams"), {
                subjectId: subId, fileName: file.name, url: url,
                uploadedBy: auth.currentUser.uid, createdAt: serverTimestamp()
            });
            status.textContent = "Erfolg!";
            document.getElementById('upload-file').value = "";
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
