<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite – SpickerSeite</title>
    <!-- EmailJS SDK (falls benötigt) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        /* ── CONTAINER & CARDS ── */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* ── SUCHE ── */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        .search-box {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

            .search-box::placeholder {
                color: #888;
            }

            .search-box:focus {
                background: rgba(255, 255, 255, 1);
                box-shadow: 0 0 15px rgba(255,255,255,0.3);
            }

        /* ── FÄCHER GRID ── */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .subject-card:hover {
                background: rgba(255, 255, 255, 0.25);
                transform: translateY(-5px);
            }

        /* ── ADMIN ACTIONS ── */
        .admin-actions {
            margin-bottom: 30px;
            display: none;
        }

        .btn-add-subject {
            background: #ffeb3b;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

            .btn-add-subject:hover {
                transform: scale(1.05);
                background: #fff176;
            }

        /* ── UPLOAD ── */
        .upload-box {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        select, input[type="file"] {
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            border: none;
        }

        .btn-upload {
            background: linear-gradient(135deg, #5dade2, #2e86c1);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1>Fächer & Altklausuren</h1>

            <!-- Suchfeld -->
            <div class="search-container">
                <input type="text" id="search" class="search-box" placeholder="Fach suchen..." onkeyup="filterSubjects()">
            </div>

            <!-- Admin Bereich: Fach hinzufügen -->
            <div class="admin-actions" id="admin-add-area">
                <button class="btn-add-subject" onclick="addNewSubject()">+ Fach hinzufügen</button>
            </div>

            <div class="subject-grid" id="subject-list">
                <!-- Fächer werden hier geladen -->
            </div>

            <div class="upload-box">
                <h2>Altklausur hochladen</h2>
                <select id="upload-subject"><option value="">Fach wählen...</option></select>
                <input type="file" id="upload-file" accept="application/pdf">
                <button class="btn-upload" onclick="handleUpload()">Hochladen</button>
                <p id="status"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allSubjects = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('user-name').textContent = data.name;

                // Admin-Check
                if (data.isAdmin) {
                    document.getElementById('admin-link').style.display = 'inline';
                    document.getElementById('admin-add-area').style.display = 'block';
                }

                // Echtzeit-Laden der Fächer
                listenToSubjects();
            }
        });

        // Fächer in Echtzeit laden
        function listenToSubjects() {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                allSubjects = [];
                const list = document.getElementById('subject-list');
                const select = document.getElementById('upload-subject');

                list.innerHTML = "";
                select.innerHTML = '<option value="">Fach wählen...</option>';

                snapshot.forEach(d => {
                    const sub = { id: d.id, ...d.data() };
                    allSubjects.push(sub);

                    // Karte erstellen
                    const card = document.createElement('div');
                    card.className = 'subject-card';
                    card.innerHTML = `<h3>${sub.name}</h3>`;
                    card.onclick = () => window.location.href = `fach.html?id=${sub.id}`;
                    list.appendChild(card);

                    // Dropdown füllen
                    const opt = document.createElement('option');
                    opt.value = sub.id;
                    opt.textContent = sub.name;
                    select.appendChild(opt);
                });
            });
        }

        // Suche / Filter
        window.filterSubjects = () => {
            const term = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('subject-list');
            list.innerHTML = "";

            const filtered = allSubjects.filter(s => s.name.toLowerCase().includes(term));
            filtered.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `<h3>${sub.name}</h3>`;
                card.onclick = () => window.location.href = `fach.html?id=${sub.id}`;
                list.appendChild(card);
            });
        };

        // Admin: Neues Fach hinzufügen
        window.addNewSubject = async () => {
            const name = prompt("Wie soll das neue Fach heißen?");
            if (name && name.trim() !== "") {
                try {
                    await addDoc(collection(db, "subjects"), {
                        name: name.trim(),
                        createdAt: serverTimestamp()
                    });
                    alert("Fach erfolgreich hinzugefügt!");
                } catch (e) {
                    alert("Fehler: " + e.message);
                }
            }
        };

        // Upload Logik
        window.handleUpload = async () => {
            const file = document.getElementById('upload-file').files[0];
            const subId = document.getElementById('upload-subject').value;
            const status = document.getElementById('status');
            if (!file || !subId) return alert("Bitte Fach wählen und Datei aussuchen!");

            status.textContent = "Upload läuft...";
            try {
                const sRef = ref(storage, `exams/${subId}/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(sRef, file);
                const url = await getDownloadURL(snap.ref);

                await addDoc(collection(db, "exams"), {
                    subjectId: subId, fileName: file.name, url: url,
                    uploadedBy: auth.currentUser.uid, createdAt: serverTimestamp()
                });
                status.textContent = "Erfolgreich hochgeladen!";
                document.getElementById('upload-file').value = "";
            } catch (e) {
                status.textContent = "Fehler beim Upload.";
            }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
