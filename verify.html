<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konto verifizieren – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1b4f72;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
        }

        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #5dade2;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 25px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="status-title">⏳ Verifizierung läuft...</h1>
        <div id="loader" class="loader"></div>
        <p id="status-text">Bitte warten, dein Zugang wird aktiviert.</p>
        <a href="login.html" id="login-btn" class="btn" style="display: none;">👉 Jetzt Anmelden</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid');
        const token = params.get('token');

        async function verify() {
            if (!uid || !token) {
                showError("Ungültiger oder unvollständiger Verifizierungslink.");
                return;
            }

            try {
                const userRef = doc(db, "users", uid);
                const userDoc = await getDoc(userRef);

                if (userDoc.exists()) {
                    const data = userDoc.data();

                    // Bereits freigeschaltet?
                    if (data.isApproved) {
                        showSuccess("Dein Konto ist bereits freigeschaltet!");
                        return;
                    }

                    // Token abgleichen
                    if (data.verifyToken && data.verifyToken === token) {
                        // Konto automatisch freischalten & Token löschen
                        await updateDoc(userRef, {
                            isApproved: true,
                            verifyToken: ""
                        });
                        showSuccess("Dein Konto wurde erfolgreich aktiviert!");
                    } else {
                        showError("Der Verifizierungslink ist ungültig oder abgelaufen.");
                    }
                } else {
                    showError("Nutzerkonto nicht gefunden.");
                }
            } catch (err) {
                console.error(err);
                showError("Ein Fehler ist aufgetreten: " + err.message);
            }
        }

        function showSuccess(msg) {
            document.getElementById('status-title').textContent = "🎉 Geschafft!";
            document.getElementById('status-text').textContent = msg;
            document.getElementById('loader').style.display = "none";
            document.getElementById('login-btn').style.display = "inline-block";
        }

        function showError(msg) {
            document.getElementById('status-title').textContent = "❌ Fehler";
            document.getElementById('status-text').textContent = msg;
            document.getElementById('loader').style.display = "none";
        }

        verify();
    </script>
</body>
</html>
